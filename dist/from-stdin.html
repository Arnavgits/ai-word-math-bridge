<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Word Math Bridge Output</title>
  <style>
    body { font-family: Cambria, "Times New Roman", serif; line-height: 1.45; max-width: 760px; margin: 40px auto; padding: 0 20px; }
    .math-display { margin: 18px 0; text-align: center; }
    .math-inline { display: inline-block; vertical-align: middle; }
    button { font: inherit; padding: 8px 12px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <button id="copy">Copy Rich HTML</button>
  <main id="content">
<p># Sample AI Math Response<br><br>The marginal rate can be written inline as </p>
<span class="math-inline"><math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>μ</mi><mi>x</mi></msub><mo>=</mo><mfrac><msub><mi>p</mi><mi>y</mi></msub><msub><mi>p</mi><mi>x</mi></msub></mfrac><mo>-</mo><mn>6</mn></mrow></math></span>
<p>, which is useful in the budget condition.<br><br>For a display equation:<br><br></p>
<div class="math-display"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msubsup><mi>x</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>y</mi><mn>2</mn><mn>3</mn></msubsup><mo>=</mo><mfrac><mrow><mi>α</mi><mo>+</mo><mi>β</mi></mrow><mi>μ</mi></mfrac></mrow></math></div>
<p><br><br>A small matrix example is:<br><br></p>
<div class="math-display"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mn>2</mn></mtd></mtr><mtr><mtd><mn>3</mn></mtd><mtd><mn>4</mn></mtd></mtr></mtable></math></div>
<p><br></p>
  </main>
  <script>
    document.getElementById("copy").addEventListener("click", async () => {
      const html = document.getElementById("content").innerHTML;
      const blob = new Blob([html], { type: "text/html" });
      await navigator.clipboard.write([new ClipboardItem({ "text/html": blob })]);
    });
  </script>
</body>
</html>
