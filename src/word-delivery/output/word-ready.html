<!DOCTYPE html><html><head><meta charset="utf-8"/></head><body>The quadratic formula is <math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>x</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mi>b</mi><mi>±</mi><msqrt><mrow><msup><mi>b</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>a</mi><mi>c</mi></mrow></msqrt></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac></mrow></math><br/><br/>For inline math, Einstein's relation <math xmlns="http://www.w3.org/1998/Math/MathML"><mi>E</mi><mo>=</mo><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup></math> is famous. Greek letters like <math xmlns="http://www.w3.org/1998/Math/MathML"><mi>α</mi><mo>+</mo><mi>β</mi><mo>=</mo><mi>γ</mi></math> appear often.<br/><br/>Display matrices:<br/><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mo>[</mo><mtable columnspacing="1em" rowspacing="4pt"><mtr><mtd><mn>1</mn></mtd><mtd><mn>2</mn></mtd></mtr><mtr><mtd><mn>3</mn></mtd><mtd><mn>4</mn></mtd></mtr></mtable><mo>]</mo></mrow></math><br/><br/>Mixed prose with a fraction <math xmlns="http://www.w3.org/1998/Math/MathML"><mfrac><msub><mi>a</mi><TeXAtom><mi>n</mi><mo>+</mo><mn>1</mn></TeXAtom></msub><msup><mi>b</mi><mn>2</mn></msup></mfrac></math> ends here.<br/></body></html>
