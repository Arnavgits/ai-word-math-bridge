<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>AI Word Math Bridge Add-in</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 12px; }
    textarea { width: 100%; box-sizing: border-box; font-family: Consolas, monospace; }
    button { margin-top: 8px; padding: 6px 10px; }
    #status { margin-top: 8px; font-size: 0.9rem; color: #444; }
  </style>
</head>
<body>
  <h2>Insert AI Math</h2>
  <p>Paste AI response text, then insert OMML at the cursor.</p>
  <textarea id="input" rows="8" placeholder="Paste text with $...$ or $$...$$ math"></textarea>
  <button id="insert">Insert at cursor</button>
  <div id="status">Loading Office.js…</div>
  <script type="module" src="taskpane.js"></script>
</body>
</html>
